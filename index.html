<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 历史背诵助手</title>

<!-- PWA Manifest -->
<link rel="manifest" href="./manifest.webmanifest">

<!-- 浏览器主题色 -->
<meta name="theme-color" content="#667eea">

<!-- iOS/移动端基础设置，虽然你主要用 Chrome/Edge，但加上没坏处 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="历史背诵助手">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- 应用图标 -->
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 标题 */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* 工具栏 */
        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .toolbar-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
        }

        .dynasty-select {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            min-width: 150px;
        }

        .dynasty-select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 统计栏 */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85em;
            color: #888;
        }

        /* 闪卡区域 */
        .flashcard-area {
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            min-height: 350px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            min-height: 350px;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .flashcard-front {
            background: linear-gradient(145deg, #ffffff 0%, #f5f7fa 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .flashcard-back {
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-dynasty {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(102, 126, 234, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #667eea;
        }

        .flashcard-back .card-dynasty {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .card-number {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.9em;
            color: #aaa;
        }

        .flashcard-back .card-number {
            color: rgba(255,255,255,0.7);
        }

        .card-content {
            text-align: center;
            font-size: 1.4em;
            line-height: 1.8;
            padding: 20px;
        }

        .card-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            opacity: 0.6;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: white;
            color: #667eea;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        /* 功能按钮 */
        .action-buttons {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .action-title {
            text-align: center;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .action-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .action-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .action-btn .icon {
            font-size: 1.5em;
            display: block;
            margin-bottom: 5px;
        }

        .action-btn .text {
            font-size: 0.85em;
            color: #666;
        }

        /* 添加卡片模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus, 
        .form-group textarea:focus, 
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1em;
            z-index: 2000;
            transition: transform 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .empty-state .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #888;
        }

        /* 评分区域 */
        .rating-area {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .rating-title {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .rating-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .rating-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .rating-btn.hard {
            background: #ffebee;
            color: #f44336;
        }

        .rating-btn.medium {
            background: #fff3e0;
            color: #ff9800;
        }

        .rating-btn.easy {
            background: #e8f5e9;
            color: #4caf50;
        }

        .rating-btn:hover {
            transform: scale(1.05);
        }

        /* 随机模式指示器 */
        .mode-indicator {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            display: none;
        }

        .mode-indicator.active {
            display: block;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-wrap: wrap;
            }

            .btn {
                flex: 1;
                justify-content: center;
                min-width: 120px;
            }

            .flashcard-front, .flashcard-back {
                padding: 30px 20px;
            }

            .card-content {
                font-size: 1.2em;
            }

            .stats {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>📚 历史背诵助手</h1>
            <p>高效记忆，轻松背诵历史知识</p>
        </div>

        <div class="mode-indicator" id="modeIndicator">
            🎲 随机模式已开启
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索历史知识点...">
                </div>
                <select class="dynasty-select" id="dynastySelect">
                    <option value="all">📖 全部朝代</option>
                    <option value="先秦">🌅 先秦</option>
                    <option value="秦汉">⚔️ 秦汉</option>
                    <option value="三国两晋南北朝">🏯 三国两晋南北朝</option>
                    <option value="隋唐">🌙 隋唐</option>
                    <option value="宋元">🎭 宋元</option>
                    <option value="明清">🏮 明清</option>
                    <option value="近现代">🔥 近现代</option>
                    <option value="世界历史">🌍 世界历史</option>
                </select>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="currentNum">0</div>
                    <div class="stat-label">当前</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="masteredCount">0</div>
                    <div class="stat-label">已掌握</div>
                </div>
            </div>
        </div>

        <!-- 闪卡 -->
        <div class="flashcard-area">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="flashcard-front">
                    <div class="card-dynasty" id="frontDynasty">加载中...</div>
                    <div class="card-number" id="cardNumber">1/10</div>
                    <div class="card-content" id="questionContent">点击开始背诵</div>
                    <div class="card-hint">👆 点击翻转查看答案</div>
                </div>
                <div class="flashcard-back">
                    <div class="card-dynasty" id="backDynasty">加载中...</div>
                    <div class="card-number" id="cardNumberBack">1/10</div>
                    <div class="card-content" id="answerContent">答案将显示在这里</div>
                    <div class="card-hint">👆 点击翻回问题</div>
                </div>
            </div>
        </div>

        <!-- 掌握程度评分 -->
        <div class="rating-area" id="ratingArea">
            <div class="rating-title">📝 记忆程度</div>
            <div class="rating-buttons">
                <button class="rating-btn hard" onclick="rateCard('hard')">😰 不熟</button>
                <button class="rating-btn medium" onclick="rateCard('medium')">🤔 模糊</button>
                <button class="rating-btn easy" onclick="rateCard('easy')">😎 掌握</button>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-primary" onclick="prevCard()">⬅️ 上一个</button>
            <button class="btn btn-primary" onclick="nextCard()">➡️ 下一个</button>
            <button class="btn btn-warning" onclick="toggleRandom()">🎲 随机</button>
        </div>

        <!-- 功能按钮 -->
        <div class="action-buttons">
            <div class="action-title">🛠️ 更多功能</div>
            <div class="action-grid">
                <button class="action-btn" onclick="showModal('addModal')">
                    <span class="icon">➕</span>
                    <span class="text">添加卡片</span>
                </button>
                <button class="action-btn" onclick="showModal('importModal')">
                    <span class="icon">📥</span>
                    <span class="text">导入数据</span>
                </button>
                <button class="action-btn" onclick="exportData()">
                    <span class="icon">📤</span>
                    <span class="text">导出数据</span>
                </button>
                <button class="action-btn" onclick="showMasteredOnly()">
                    <span class="icon">✅</span>
                    <span class="text">已掌握</span>
                </button>
                <button class="action-btn" onclick="showHardOnly()">
                    <span class="icon">🔴</span>
                    <span class="text">不熟悉的</span>
                </button>
                <button class="action-btn" onclick="showAllCards()">
                    <span class="icon">📖</span>
                    <span class="text">全部显示</span>
                </button>
                <button class="action-btn" id="installBtn" style="display:none;">
                    <span class="icon">⬇️</span>
                    <span class="text">安装应用</span>
                </button>


            </div>
        </div>
    </div>

    <!-- 添加卡片模态框 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-title">➕ 添加新卡片</div>
            <div class="form-group">
                <label>朝代/时期</label>
                <select id="addDynasty">
                    <option value="先秦">先秦</option>
                    <option value="秦汉">秦汉</option>
                    <option value="三国两晋南北朝">三国两晋南北朝</option>
                    <option value="隋唐">隋唐</option>
                    <option value="宋元">宋元</option>
                    <option value="明清">明清</option>
                    <option value="近现代">近现代</option>
                    <option value="世界历史">世界历史</option>
                </select>
            </div>
            <div class="form-group">
                <label>问题（正面）</label>
                <textarea id="addQuestion" placeholder="请输入问题或关键词..."></textarea>
            </div>
            <div class="form-group">
                <label>答案（背面）</label>
                <textarea id="addAnswer" placeholder="请输入答案或详细内容..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="hideModal('addModal')">取消</button>
                <button class="btn btn-success" onclick="addCard()">添加</button>
            </div>
        </div>
    </div>

    <!-- 导入数据模态框 -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <div class="modal-title">📥 导入数据</div>
            <div class="form-group">
                <label>粘贴JSON数据</label>
                <textarea id="importData" placeholder='粘贴导出的JSON数据...'></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="hideModal('importModal')">取消</button>
                <button class="btn btn-success" onclick="importData()">导入</button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast">操作成功</div>

    <script>
        // 默认历史知识数据
        const defaultCards = [
            // 先秦
            { id: 1, dynasty: '先秦', question: '甲骨文是什么？', answer: '甲骨文是中国商周时期刻写在龟甲和兽骨上的文字，是中国已发现的古代文字中年代最早、体系较为完整的文字。', mastered: false },
            { id: 2, dynasty: '先秦', question: '分封制的主要内容？', answer: '周王把土地和人民分给宗亲和功臣，封他们为诸侯。诸侯必须服从周王命令，镇守疆土，随从作战，交纳贡赋，朝觐述职。', mastered: false },
            { id: 3, dynasty: '先秦', question: '百家争鸣的主要学派及代表人物？', answer: '儒家：孔子、孟子；道家：老子、庄子；墨家：墨子；法家：韩非子；兵家：孙武。', mastered: false },
            { id: 4, dynasty: '先秦', question: '孔子的核心思想是什么？', answer: '"仁"是孔子思想的核心，主张"仁者爱人"，"己所不欲，勿施于人"。政治上主张"为政以德"。', mastered: false },
            
            // 秦汉
            { id: 5, dynasty: '秦汉', question: '秦始皇统一六国的时间？', answer: '公元前221年，秦王嬴政完成统一，建立中国历史上第一个统一的多民族的中央集权国家——秦朝。', mastered: false },
            { id: 6, dynasty: '秦汉', question: '秦朝的中央集权制度包括哪些内容？', answer: '皇帝制度、三公九卿制、郡县制。统一文字（小篆）、货币（圆形方孔钱）、度量衡。', mastered: false },
            { id: 7, dynasty: '秦汉', question: '汉武帝的大一统措施有哪些？', answer: '政治：颁布推恩令；思想：罢黜百家，独尊儒术；经济：盐铁官营；军事：北击匈奴，开通丝绸之路。', mastered: false },
            { id: 8, dynasty: '秦汉', question: '丝绸之路的起点和终点？', answer: '起点：长安（今西安）；终点：大秦（古罗马）。促进了东西方经济文化交流。', mastered: false },
            
            // 三国两晋南北朝
            { id: 9, dynasty: '三国两晋南北朝', question: '官渡之战的时间和意义？', answer: '公元200年，曹操以少胜多击败袁绍，为统一北方奠定基础。', mastered: false },
            { id: 10, dynasty: '三国两晋南北朝', question: '赤壁之战的时间和意义？', answer: '公元208年，孙刘联军以少胜多击败曹操，奠定了三国鼎立局面。', mastered: false },
            { id: 11, dynasty: '三国两晋南北朝', question: '北魏孝文帝改革的主要内容？', answer: '迁都洛阳；改汉姓、穿汉服、说汉话、与汉族通婚；采用汉族官制、律令。促进了民族融合。', mastered: false },
            
            // 隋唐
            { id: 12, dynasty: '隋唐', question: '隋朝大运河的四段和中心？', answer: '四段：永济渠、通济渠、邗沟、江南河；中心：洛阳；北达涿郡，南至余杭。', mastered: false },
            { id: 13, dynasty: '隋唐', question: '贞观之治是谁开创的？', answer: '唐太宗李世民。政治清明，经济发展，社会稳定，国力强盛。', mastered: false },

            { id: 20, dynasty: '明清', question: '清朝巩固统一的措施？', answer: '平定三藩之乱；收复台湾，设台湾府；平定大小和卓叛乱；设驻藏大臣；雅克萨之战。', mastered: false },
            
            // 近现代
            { id: 21, dynasty: '近现代', question: '鸦片战争的影响？', answer: '1840年鸦片战争后，签订《南京条约》，中国开始沦为半殖民地半封建社会，是中国近代史的开端。', mastered: false },
            { id: 22, dynasty: '近现代', question: '五四运动的意义？', answer: '1919年五四运动，是一次彻底的反帝反封建的爱国运动，是中国新民主主义革命的开端。', mastered: false },
            { id: 23, dynasty: '近现代', question: '中国共产党成立的时间和意义？', answer: '1921年7月，中共一大召开，标志着中国共产党成立。中国革命的面貌焕然一新。', mastered: false },
            
            // 世界历史
            { id: 24, dynasty: '世界历史', question: '文艺复兴的中心和核心思想？', answer: '14-16世纪，中心在意大利。核心思想是人文主义，主张以人为中心，肯定人的价值和尊严。', mastered: false },
            { id: 25, dynasty: '世界历史', question: '美国独立战争的时间和意义？', answer: '1775-1783年。推翻英国殖民统治，实现独立，确立民主共和政体，促进资本主义发展。', mastered: false },
            { id: 26, dynasty: '世界历史', question: '法国大革命开始的标志？', answer: '1789年7月14日，巴黎人民攻占巴士底狱。颁布《人权宣言》，传播了自由民主思想。', mastered: false },
        ];

        // 应用状态
        let cards = [];
        let filteredCards = [];
        let currentIndex = 0;
        let isFlipped = false;
        let isRandomMode = false;

        // 初始化
        function init() {
            loadData();
            filteredCards = [...cards];
            updateDisplay();
            setupEventListeners();
        }

        // 加载数据
        function loadData() {
            const savedCards = localStorage.getItem('historyCards');
            if (savedCards) {
                cards = JSON.parse(savedCards);
            } else {
                cards = [...defaultCards];
                saveData();
            }
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('historyCards', JSON.stringify(cards));
        }

        // 设置事件监听
        function setupEventListeners() {
            // 搜索功能
            document.getElementById('searchInput').addEventListener('input', function(e) {
                filterCards();
            });

            // 朝代筛选
            document.getElementById('dynastySelect').addEventListener('change', function(e) {
                filterCards();
            });
        }

        // 筛选卡片
        function filterCards() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const dynasty = document.getElementById('dynastySelect').value;

            filteredCards = cards.filter(card => {
                const matchSearch = card.question.toLowerCase().includes(searchTerm) || 
                                   card.answer.toLowerCase().includes(searchTerm);
                const matchDynasty = dynasty === 'all' || card.dynasty === dynasty;
                return matchSearch && matchDynasty;
            });

            currentIndex = 0;
            updateDisplay();
        }

        // 更新显示
        function updateDisplay() {
            if (filteredCards.length === 0) {
                showEmptyState();
                return;
            }

            const card = filteredCards[currentIndex];
            
            // 重置翻转状态
            if (isFlipped) {
                flipCard();
            }

            // 更新卡片内容
            document.getElementById('frontDynasty').textContent = card.dynasty;
            document.getElementById('backDynasty').textContent = card.dynasty;
            document.getElementById('questionContent').textContent = card.question;
            document.getElementById('answerContent').textContent = card.answer;
            document.getElementById('cardNumber').textContent = `${currentIndex + 1}/${filteredCards.length}`;
            document.getElementById('cardNumberBack').textContent = `${currentIndex + 1}/${filteredCards.length}`;

            // 更新统计
            document.getElementById('totalCount').textContent = cards.length;
            document.getElementById('currentNum').textContent = `${currentIndex + 1}/${filteredCards.length}`;
            document.getElementById('masteredCount').textContent = cards.filter(c => c.mastered).length;
        }

        // 显示空状态
        function showEmptyState() {
            document.getElementById('questionContent').textContent = '没有找到匹配的卡片';
            document.getElementById('answerContent').textContent = '试试其他搜索条件或添加新卡片';
            document.getElementById('frontDynasty').textContent = '';
            document.getElementById('backDynasty').textContent = '';
            document.getElementById('cardNumber').textContent = '0/0';
            document.getElementById('cardNumberBack').textContent = '0/0';
            document.getElementById('totalCount').textContent = cards.length;
            document.getElementById('currentNum').textContent = '0/0';
            document.getElementById('masteredCount').textContent = cards.filter(c => c.mastered).length;
        }

        // 翻转卡片
        function flipCard() {
            if (filteredCards.length === 0) return;
            
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        // 上一个
        function prevCard() {
            if (filteredCards.length === 0) return;
            
            if (isRandomMode) {
                currentIndex = Math.floor(Math.random() * filteredCards.length);
            } else {
                currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
            }
            updateDisplay();
        }

        // 下一个
        function nextCard() {
            if (filteredCards.length === 0) return;
            
            if (isRandomMode) {
                currentIndex = Math.floor(Math.random() * filteredCards.length);
            } else {
                currentIndex = (currentIndex + 1) % filteredCards.length;
            }
            updateDisplay();
        }

        // 切换随机模式
        function toggleRandom() {
            isRandomMode = !isRandomMode;
            document.getElementById('modeIndicator').classList.toggle('active');
            showToast(isRandomMode ? '🎲 随机模式已开启' : '📖 顺序模式已恢复');
        }

        // 评分
        function rateCard(rating) {
            if (filteredCards.length === 0) return;
            
            const card = filteredCards[currentIndex];
            const originalCard = cards.find(c => c.id === card.id);
            
            if (rating === 'easy') {
                originalCard.mastered = true;
                showToast('✅ 已标记为掌握！');
            } else if (rating === 'hard') {
                originalCard.mastered = false;
                showToast('💪 加油，多看几次！');
            } else {
                showToast('🤔 模糊，再来一次！');
            }
            
            saveData();
            
            // 自动翻到下一张
            setTimeout(() => {
                nextCard();
            }, 500);
        }

        // 显示已掌握
        function showMasteredOnly() {
            filteredCards = cards.filter(c => c.mastered);
            currentIndex = 0;
            updateDisplay();
            showToast(`✅ 已掌握：${filteredCards.length} 张`);
        }

        // 显示不熟悉的
        function showHardOnly() {
            filteredCards = cards.filter(c => !c.mastered);
            currentIndex = 0;
            updateDisplay();
            showToast(`🔴 待加强：${filteredCards.length} 张`);
        }

        // 显示全部
        function showAllCards() {
            const dynasty = document.getElementById('dynastySelect').value;
            if (dynasty === 'all') {
                filteredCards = [...cards];
            } else {
                filteredCards = cards.filter(c => c.dynasty === dynasty);
            }
            currentIndex = 0;
            updateDisplay();
            showToast(`📖 显示全部：${filteredCards.length} 张`);
        }

        // 显示模态框
        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        // 隐藏模态框
        function hideModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 添加卡片
        function addCard() {
            const dynasty = document.getElementById('addDynasty').value;
            const question = document.getElementById('addQuestion').value.trim();
            const answer = document.getElementById('addAnswer').value.trim();

            if (!question || !answer) {
                showToast('❌ 请填写完整信息');
                return;
            }

            const newCard = {
                id: Date.now(),
                dynasty: dynasty,
                question: question,
                answer: answer,
                mastered: false
            };

            cards.push(newCard);
            saveData();
            
            // 清空表单
            document.getElementById('addQuestion').value = '';
            document.getElementById('addAnswer').value = '';
            
            hideModal('addModal');
            
            // 刷新显示
            filteredCards = [...cards];
            currentIndex = filteredCards.length - 1;
            updateDisplay();
            
            showToast('✅ 卡片添加成功！');
        }

        // 导出数据
        function exportData() {
            const dataStr = JSON.stringify(cards, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `历史卡片_${new Date().toLocaleDateString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 数据已导出！');
        }

        // 导入数据
        function importData() {
            const dataStr = document.getElementById('importData').value.trim();
            
            try {
                const importedCards = JSON.parse(dataStr);
                if (Array.isArray(importedCards)) {
                    cards = importedCards;
                    saveData();
                    filteredCards = [...cards];
                    currentIndex = 0;
                    updateDisplay();
                    hideModal('importModal');
                    document.getElementById('importData').value = '';
                    showToast(`📥 成功导入 ${importedCards.length} 张卡片！`);
                } else {
                    showToast('❌ 无效的数据格式');
                }
            } catch (e) {
                showToast('❌ JSON格式错误，请检查');
            }
        }

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

       // 键盘快捷键
document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch(e.key) {
        case 'ArrowLeft': prevCard(); break;
        case 'ArrowRight': nextCard(); break;
        case ' ': e.preventDefault(); flipCard(); break;
        case '1': rateCard('hard'); break;
        case '2': rateCard('medium'); break;
        case '3': rateCard('easy'); break;
    }
});
 
// 初始化应用
init();
 
// PWA 安装按钮逻辑

let deferredInstallPrompt = null;
 
window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
 
    const installBtn = document.getElementById('installBtn');
    if (installBtn) {
        installBtn.style.display = 'flex';
    }
});
 
const installBtn = document.getElementById('installBtn');
 
if (installBtn) {
    installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) {
            showToast('当前浏览器暂时没有安装提示，请使用地址栏安装按钮');
            return;
        }
 
        deferredInstallPrompt.prompt();
 
        const result = await deferredInstallPrompt.userChoice;
 
        if (result.outcome === 'accepted') {
            showToast('应用安装成功');
        } else {
            showToast('已取消安装');
        }
 
        deferredInstallPrompt = null;
        installBtn.style.display = 'none';
    });
}
 
window.addEventListener('appinstalled', () => {
    showToast('历史背诵助手已安装');
    deferredInstallPrompt = null;

    const installBtn = document.getElementById('installBtn');
    if (installBtn) {
        installBtn.style.display = 'none';
    }
});

// ===== 荣耀/华为设备 PWA 兼容处理 =====
(function honorCompat() {
    const ua = navigator.userAgent || '';
    const isHonor = /honor|huawei/i.test(ua);
    if (!isHonor) return;

    // 安装事件触发后，如果图标未出现在桌面，给用户指引
    window.addEventListener('appinstalled', () => {
        setTimeout(() => {
            const msg = '⚠️ 荣耀设备提示：若桌面无图标，请从 Edge 菜单(⋯)→添加到手机，手动创建快捷方式';
            showToast(msg);
        }, 3000);
    });

    // 在安装按钮旁也可提前告知
    window.addEventListener('beforeinstallprompt', () => {
        const toolbar = document.getElementById('installBtn');
        if (toolbar && toolbar.parentElement) {
            const existing = document.getElementById('honorInstallHint');
            if (!existing) {
                const hint = document.createElement('span');
                hint.id = 'honorInstallHint';
                hint.style.cssText = 'font-size:11px;color:#ff9800;display:block;text-align:center;margin-top:4px;';
                hint.textContent = '荣耀设备安装后请手动添加快捷方式';
                toolbar.parentElement.parentElement.appendChild(hint);
            }
        }
    });
})();
 
// 注册 Service Worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
        try {
            const registration = await navigator.serviceWorker.register('./service-worker.js');
            console.log('Service Worker 注册成功:', registration.scope);
        } catch (error) {
            console.error('Service Worker 注册失败:', error);
        }
    });
}
